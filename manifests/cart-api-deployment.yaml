apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-api-deployment
  namespace: test
  labels:
    app: cart-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-api
  template:
    metadata:
      labels:
        app: cart-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432;
              do
                echo "Waiting db connection"
                sleep 2;
              done;
      containers:
        - name: cart-api
          image: cart-api:latest
          imagePullPolicy: Never
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cart-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cart-db-secret
                  key: POSTGRES_PASSWORD
          ports: 
            - containerPort: 8080
          volumeMounts:
            - name: config-volume
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
      volumes:
        - name: config-volume
          configMap:
            name: cart-api-config
            items: 
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: cart-api-service
  namespace: test
spec:
  selector:
    app: cart-api
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP   