environment: prod

quota:
  requests:
    cpu: "4"
    memory: "4Gi"
  limits:
    cpu: "8"
    memory: "8Gi" 
  pods: 30

api:
  replicaCount: 3
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi" 
    limits:
      cpu: "1"
      memory: "512Mi" 

autoscaling:
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 25

postgres:
  storage: 10Gi
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"