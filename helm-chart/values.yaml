namespace: test

quota:
  requests:
    cpu: 1
    memory: 1Gi
  limits:
    cpu: 2
    memory: 2Gi
  pods: 10

api:
  replicaCount: 1
  image:
    repository: cart-api
    tag: latest
  initImage:
    repository: busybox
    tag: "1.36"
  service:
    port: 8080
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

autoscaling:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 20

postgres:
  image:
    repository: postgres
    tag: 16-alpine
  service:
    port: 5432
  storage: 1Gi
  auth:
    user: "root"
    password: "secret"
    database: "cart-api"
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"