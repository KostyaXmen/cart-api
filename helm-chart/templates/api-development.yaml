apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-api-deployment
  namespace: {{ .Values.namespace }}
  labels:
    app: cart-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: cart-api
  template:
    metadata:
      labels:
        app: cart-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.api.initImage.repository }}:{{ .Values.api.initImage.tag }}"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service {{ .Values.postgres.service.port }};
              do
                echo "Waiting db connection"
                sleep 2;
              done;
      containers:
        - name: cart-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: Never
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cart-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cart-db-secret
                  key: POSTGRES_PASSWORD
          ports: 
            - containerPort: {{ .Values.api.service.port }}
          volumeMounts:
            - name: config-volume
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
          resources:
            limits:
              cpu: {{ .Values.api.resources.limits.cpu }}
              memory: {{ .Values.api.resources.limits.memory }}
            requests:
              cpu: {{ .Values.api.resources.requests.cpu }}
              memory: {{ .Values.api.resources.requests.memory }}
      volumes:
        - name: config-volume
          configMap:
            name: cart-api-config
            items: 
              - key: config.yaml
                path: config.yaml